# Front em container. O back-end (Supabase) sobe pelo CLI: `npx supabase start`.
# As variáveis vêm do arquivo .env (copie de .env.example).
services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "8080:80"
    restart: unless-stopped
